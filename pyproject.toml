[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microtwin"
version = "0.1.0"
description = "Micro Digital Twin PoC: anomaly detection pipeline for particle accelerator sensor data (temperature & beam intensity)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Cedl-dev" }]
keywords = [
    "digital-twin",
    "mlops",
    "particle-accelerator",
    "anomaly-detection",
    "ganil",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "mlflow>=2.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

[project.scripts]
microtwin-build-dataset = "microtwin.cli:build_dataset"
microtwin-train = "microtwin.cli:train_model"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # Pydantic (v2) evaluates model field annotations at runtime even under
    # `from __future__ import annotations`. On the minimum supported Python
    # (3.9), `X | None` isn't valid at runtime, only `Optional[X]` is — so
    # this suggestion would introduce a crash on 3.9 if applied.
    "UP045",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Note: a NotOpenSSLWarning from urllib3 (macOS's system Python 3.9 links
# against LibreSSL, not OpenSSL) is not filterable here: a pytest plugin
# imports urllib3 during plugin auto-loading, before any filterwarnings
# config takes effect. It's a harmless, environment-only warning (Linux
# containers use real OpenSSL, so it disappears under Docker) — not
# something this project's code can or should fix.

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# mlflow pulls in protobuf's "google" namespace package, which has no
# __init__.py. mypy's incremental cache occasionally corrupts itself around
# namespace packages like this one (a known upstream mypy issue), crashing
# with "AssertionError: Cannot find module for google". Skipping analysis of
# this module entirely avoids the crash without weakening our own checks.
module = "google.*"
ignore_missing_imports = true
follow_imports = "skip"
